id: KDAC-008
titulo: Possível password spray por IP
descricao: Agrupa falhas de autenticação de um IP para pelo menos dez contas em trinta minutos. Poucas tentativas
  por conta diferenciam o padrão de uma senha esquecida, mas não comprovam reutilização da mesma senha.
attack:
- tecnica: T1110.003
  nome: 'Brute Force: Password Spraying'
  tatica: credential-access
tabelas:
- EntraIdSignInEvents
severidade: alta
falsos_positivos:
- Proxy ou NAT compartilhado concentrando falhas de usuários distintos; ajuste limiares por ambiente.
query: |
  // Ajustáveis: contas por IP, janela fixa e máximo de falhas por conta.
  let limiar_contas = 10;
  let janela = 30m;
  let maximo_por_conta = 3;
  EntraIdSignInEvents
  | where ErrorCode != 0 and isnotempty(AccountUpn) and isnotempty(IPAddress)
  // Normaliza UPN antes de contar para não duplicar uma identidade por capitalização.
  | extend Conta = tolower(AccountUpn)
  | summarize TentativasConta = count() by IPAddress, Conta, Janela = bin(Timestamp, janela)
  | summarize Contas = count(), Tentativas = sum(TentativasConta), MaiorTentativasConta = max(TentativasConta) by IPAddress, Janela
  | where Contas >= limiar_contas and MaiorTentativasConta <= maximo_por_conta
testes:
  positivo:
    fixture: tests/fixtures/KDAC-008/positivo.json
    minimo: 1
  negativo:
    fixture: tests/fixtures/KDAC-008/negativo.json
    maximo: 0
referencias:
- https://attack.mitre.org/techniques/T1110/003/
- https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-entraidsigninevents-table
