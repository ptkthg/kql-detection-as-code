name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m kdac.validar
      - run: uv run python -m kdac.documentar --check
      - run: uv run pytest tests/test_validar.py tests/test_documentar.py

  testar:
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:81bb7fc1cdda3ee96f725221bbf37b525eca32718d2c2c6a4a6522f84ec97458
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Aguardar saúde do Kusto por até 180 segundos
        shell: bash
        run: |
          limite=$((SECONDS + 180))
          until curl --fail --silent --show-error --max-time 3 \
            -H 'Content-Type: application/json' \
            -d '{"db":"NetDefaultDB","csl":".show databases"}' \
            http://localhost:8080/v1/rest/mgmt > /dev/null; do
            if (( SECONDS >= limite )); then
              echo "Emulador Kusto não respondeu dentro do prazo."
              exit 1
            fi
            sleep 2
          done
      - run: uv run pytest -v
