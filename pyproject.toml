[project]
name = "kql-detection-as-code"
version = "0.1.0"
description = "Detecções KQL com fixtures sintéticos e testes no Kusto"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
